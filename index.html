<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Viewer GitHub Wiki com Shadow DOM</title>
    <style>
      :root {
        --bg: #0b0d10;
        --fg: #e8edf2;
        --muted: #94a3b8;
        --brand: #3b82f6;
        --card: #12161b;
        --border: #1f2937;
      }
      html, body {
        height: 100%;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica Neue, Arial, "Apple Color Emoji", "Segoe UI Emoji";
        background: linear-gradient(180deg, #0b0d10 0%, #0f172a 100%);
        color: var(--fg);
        display: grid;
        grid-template-rows: auto 1fr;
      }
      header {
        display: flex;
        align-items: center;
        gap: .75rem;
        padding: 1rem clamp(1rem, 2vw, 2rem);
        border-bottom: 1px solid var(--border);
        background: color-mix(in oklab, var(--card) 85%, transparent);
        position: sticky;
        top: 0;
        z-index: 10;
        backdrop-filter: blur(8px);
      }
      header h1 {
        font-size: 1rem;
        font-weight: 600;
        margin: 0;
        letter-spacing: .02em;
        color: var(--muted);
      }
      .controls {
        margin-left: auto;
        display: flex;
        gap: .5rem;
      }
      .url-input {
        min-width: min(720px, 60vw);
        max-width: 80vw;
        background: var(--card);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: .75rem;
        padding: .6rem .8rem;
      }
      button {
        background: var(--brand);
        color: white;
        border: none;
        padding: .6rem .9rem;
        border-radius: .75rem;
        font-weight: 600;
        cursor: pointer;
      }
      main {
        padding: 1rem;
      }
      .card {
        height: calc(100vh - 90px);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 1rem;
        overflow: hidden;
      }

      /* estilo do placeholder caso iframe falhe */
      .fallback {
        height: 100%;
        display: grid;
        place-items: center;
        color: var(--muted);
        text-align: center;
        padding: 2rem;
      }
      .fallback a { color: var(--brand); }
    </style>
  </head>
  <body>
    <header>
      <h1>GitHub Wiki → Shadow DOM</h1>
      <div class="controls">
        <input id="wikiUrl" class="url-input" type="url" placeholder="Cole um link de Wiki do GitHub" value="https://github.com/avsysgeo-thiagomota/ExtJS/wiki" />
        <button id="loadBtn">Carregar</button>
      </div>
    </header>

    <main>
      <div class="card">
        <!-- Nosso web component com Shadow DOM -->
        <shadow-wiki-viewer id="viewer" src="https://github.com/avsysgeo-thiagomota/ExtJS/wiki"></shadow-wiki-viewer>
      </div>
    </main>

    <script>
      /**
       * <shadow-wiki-viewer>
       * Um Web Component que usa Shadow DOM para isolar o layout e embute a página
       * do GitHub Wiki via <iframe>. Isso evita problemas de CORS que impedem fetch
       * e injeção direta do HTML de outros domínios.
       */
      class ShadowWikiViewer extends HTMLElement {
        static get observedAttributes() { return ["src"]; }
        constructor() {
          super();
          this.attachShadow({ mode: "open" });

          // Wrapper básico
          const wrapper = document.createElement("div");
          wrapper.setAttribute("part", "wrapper");
          wrapper.style.cssText = `
            position: relative;
            width: 100%;
            height: 100%;
            display: grid;
          `;

          // Estilos internos do Shadow DOM
          const style = document.createElement("style");
          style.textContent = `
            :host { display: contents; }
            iframe {
              border: 0;
              width: 100%;
              height: 100%;
            }
            .bar {
              position: absolute;
              inset: 0 auto auto 0;
              display: flex;
              align-items: center;
              gap: .5rem;
              background: rgba(2, 6, 23, .55);
              backdrop-filter: blur(6px);
              color: #e5e7eb;
              border-bottom-right-radius: .75rem;
              padding: .35rem .6rem;
              font: 600 12px/1 ui-sans-serif, system-ui;
              z-index: 2;
            }
            .bar code { opacity: .7; }
          `;

          // Barra informativa (mostra a URL atual)
          this.infoBar = document.createElement("div");
          this.infoBar.className = "bar";
          this.infoBar.innerHTML = `Aberto em <code>ShadowRoot</code>`;

          // Iframe sandboxed
          this.iframe = document.createElement("iframe");
          this.iframe.setAttribute("part", "iframe");
          this.iframe.referrerPolicy = "no-referrer";
          // Permissões mínimas; ajuste conforme necessidade
          this.iframe.sandbox = "allow-same-origin allow-forms allow-scripts allow-popups allow-popups-to-escape-sandbox";

          // Fallback se a navegação for bloqueada
          this.fallback = document.createElement("div");
          this.fallback.className = "fallback";
          this.fallback.innerHTML = `
            <div>
              <p>Não foi possível embutir esta página. \uD83D\uDEA7</p>
              <p>Tente abrir diretamente: <a id="fallbackLink" target="_blank" rel="noopener">link</a></p>
            </div>
          `;

          wrapper.append(this.infoBar, this.iframe);
          this.shadowRoot.append(style, wrapper);
        }

        connectedCallback() {
          // Carrega a URL inicial, se existir
          if (this.hasAttribute("src")) {
            this.load(this.getAttribute("src"));
          }
        }

        attributeChangedCallback(name, oldV, newV) {
          if (name === "src" && oldV !== newV) {
            this.load(newV);
          }
        }

        load(url) {
          try {
            // Normaliza a URL
            const u = new URL(url);
            this.currentURL = u.toString();
            this.infoBar.innerHTML = `Aberto em <code>ShadowRoot</code> · <code>${u.hostname}${u.pathname}</code>`;

            // Tenta carregar via iframe; se der erro de X-Frame-Options / CSP,
            // o site pode bloquear embedding. Nesses casos, exibimos fallback.
            this.iframe.src = this.currentURL;

            // Detecta erro de navegação (nem sempre é possível)
            const onLoad = () => {
              // se carregou, certifique-se de que o fallback não esteja na árvore
              if (this.fallback.isConnected) this.fallback.remove();
            };
            const onError = () => {
              // Mostra fallback clicável
              const wrapper = this.shadowRoot.querySelector('[part="wrapper"]');
              if (wrapper && !this.fallback.isConnected) {
                wrapper.appendChild(this.fallback);
                this.fallback.querySelector('#fallbackLink').href = this.currentURL;
              }
            };
            this.iframe.addEventListener('load', onLoad, { once: true });
            this.iframe.addEventListener('error', onError, { once: true });

          } catch (e) {
            console.warn("URL inválida:", e);
          }
        }
      }

      customElements.define('shadow-wiki-viewer', ShadowWikiViewer);

      // UI: carregar a URL digitada
      const input = document.getElementById('wikiUrl');
      const btn = document.getElementById('loadBtn');
      const viewer = document.getElementById('viewer');
      btn.addEventListener('click', () => {
        viewer.setAttribute('src', input.value.trim());
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') btn.click();
      });
    </script>
  </body>
</html>
